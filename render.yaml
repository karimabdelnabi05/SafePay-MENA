services:
  - type: web
    name: safepay-mena-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SAFEPAY_ENABLE_LIVE
        value: "false"
      - key: SAFEPAY_DATABASE
        value: ":memory:"
