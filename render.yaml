services:
  - type: web
    name: safepay-mena-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SAFEPAY_ENABLE_LIVE
        value: "true"
      - key: SAFEPAY_DATABASE
        value: ":memory:"
      - key: SAFEPAY_LIVE_RUN_LIMIT
        value: "4"
      - key: SAFEPAY_LIVE_GLOBAL_LIMIT
        value: "12"
      - key: NOKIA_RAPIDAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFEPAY_JUDGE_ACCESS_CODE
        sync: false
